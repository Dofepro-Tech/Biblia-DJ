services:
  - type: web
    name: biblia-dj
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_USE_SAME_ORIGIN_API
        value: true
      - key: VITE_APP_DOWNLOAD_URL
        value: https://bibliadj.dofepro.do/download.html
      - key: VITE_APP_APK_URL
        value: https://dofepro-tech.github.io/biblia-dj-android.apk
      - key: VITE_PUBLIC_BASE_PATH
        value: /
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_APP_NAME
        value: Biblia DJ
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BIBLE_API_KEY
        sync: false
      - key: BIBLE_API_ES_BIBLE_ID
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPINIONS_SUPABASE_URL
        sync: false
      - key: OPINIONS_SUPABASE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
