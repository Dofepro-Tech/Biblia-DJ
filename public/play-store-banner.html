<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Play Store - Biblia NG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .banner {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #0b1f4f 0%, #1a3a7a 50%, #2a5a9a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .content {
            flex: 1;
            color: white;
            z-index: 2;
        }
        .badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
        }
        h1 {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.1;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 24px;
            opacity: 0.9;
            margin-bottom: 30px;
            font-weight: 300;
        }
        .features {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .feature {
            background: rgba(255,255,255,0.15);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-icon {
            font-size: 20px;
        }
        .bible-icon {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            z-index: 2;
        }
        .bible-icon svg {
            width: 120px;
            height: 120px;
        }
        .decoration {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        .decoration-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }
        .decoration-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
        }
        .decoration-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="stars">
            <div class="star" style="width: 3px; height: 3px; top: 10%; left: 20%;"></div>
            <div class="star" style="width: 2px; height: 2px; top: 30%; left: 40%;"></div>
            <div class="star" style="width: 4px; height: 4px; top: 50%; left: 10%;"></div>
            <div class="star" style="width: 2px; height: 2px; top: 70%; left: 30%;"></div>
            <div class="star" style="width: 3px; height: 3px; top: 20%; left: 60%;"></div>
            <div class="star" style="width: 2px; height: 2px; top: 80%; left: 50%;"></div>
            <div class="star" style="width: 3px; height: 3px; top: 40%; left: 80%;"></div>
            <div class="star" style="width: 2px; height: 2px; top: 60%; left: 70%;"></div>
        </div>
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>
        
        <div class="content">
            <div class="badge">Gratis</div>
            <h1>Biblia NG</h1>
            <p class="subtitle">Lee, estudia y vive la Palabra de Dios</p>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">📖</span>
                    <span>Biblia RVR1960</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎧</span>
                    <span>Audio</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🤖</span>
                    <span>Estudio con IA</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📱</span>
                    <span>Offline</span>
                </div>
            </div>
        </div>
        
        <div class="bible-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 4V20C6 20.5523 6.44772 21 7 21H17C17.5523 21 18 20.5523 18 20V4H6ZM8 6H16V18H8V6Z" fill="#0b1f4f"/>
                <path d="M12 2L6 4V20C6 20.5523 6.44772 21 7 21H17C17.5523 21 18 20.5523 18 20V4L12 2ZM7 5L12 3.5L17 5V19H7V5Z" fill="#1a3a7a"/>
                <path d="M9 8H15V10H9V8ZM9 12H15V14H9V12ZM9 16H13V18H9V16Z" fill="#2a5a9a"/>
            </svg>
        </div>
    </div>
    
    <script>
        // Para capturar el banner como imagen, puedes usar:
        // 1. Herramientas de captura de pantalla (Snipping Tool, Lightshot)
        // 2. Extensiones de navegador (Full Page Screen Capture)
        // 3. Servicios online como html2canvas
        console.log('Para capturar: Usa una herramienta de captura de pantalla o html2canvas');
    </script>
</body>
</html>
